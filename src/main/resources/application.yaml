server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: backend-api
  threads:
    virtual:
      enabled: true # Activa Virtual Threads nativos en Java 25

  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:lawyersite}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:root}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway crea las tablas, Hibernate solo valida que coincidan
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Configuración propia para seguridad, JWT, Cookie HttpOnly y CORS
app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # Clave Hex/Base64 de al menos 256 bits
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}        # 1 hora para el access_token
      cookie-name: ${JWT_COOKIE_NAME:lawfirm_token}
      cookie-secure: ${COOKIE_SECURE:false}              # true en producción (HTTPS), false en local
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}
